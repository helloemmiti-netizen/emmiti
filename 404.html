<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Page not found — Emmiti</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23050508'/%3E%3Ctext x='50' y='72' font-size='62' font-family='Georgia,serif' font-weight='700' text-anchor='middle' fill='%23FFD700'%3EE%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --gold:#FFD700; --pink:#FF1493; --blue:#00D4FF; --bg:#050508; --text:#fff; --muted:#8888aa;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, #12121f 0%, var(--bg) 70%);
      color: var(--text);
      display:flex; align-items:center; justify-content:center; text-align:center; padding:2rem;
    }
    .wrap { max-width: 540px; }
    .code {
      font-family: Georgia, serif; font-weight:700;
      font-size: clamp(5rem, 22vw, 11rem); line-height:1;
      background: linear-gradient(135deg, var(--gold), var(--pink) 55%, var(--blue));
      -webkit-background-clip:text; background-clip:text; color:transparent;
      text-shadow: 0 0 60px rgba(255,20,147,.35);
      animation: glow 4s ease-in-out infinite;
    }
    @keyframes glow {
      0%,100%{ filter:drop-shadow(0 0 24px rgba(255,20,147,.4)); }
      50%{ filter:drop-shadow(0 0 40px rgba(255,215,0,.5)); }
    }
    h1 { font-size:1.4rem; margin:1rem 0 .5rem; }
    p { color:var(--muted); margin-bottom:2rem; line-height:1.6; }
    a {
      display:inline-block; text-decoration:none; color:#fff; font-weight:600;
      padding:.7rem 1.6rem; border-radius:50px;
      background: linear-gradient(135deg, #FF1493 0%, #FF00FF 50%, #00D4FF 100%);
      box-shadow: 0 0 24px rgba(255,20,147,.45);
      transition: transform .2s, box-shadow .2s;
    }
    a:hover { transform:translateY(-2px); box-shadow:0 0 34px rgba(255,20,147,.65); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This reel ran out.</h1>
    <p>The page you were looking for isn't here — maybe it was moved, or the link slipped a frame.</p>
    <a href="/">Back to Emmiti</a>
  </div>
</body>
</html>
